profile: passive-extended

targets:
  - http://localhost:3000
  - http://localhost:8080

http:
  backend: requests
  mode: passive
  timeout: 7
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

crawler:
  enabled: true
  max_depth: 1
  dynamic: false
  include_js: true
  backend: scrapling
  scrapling_mode: fetcher

validators:
  panels: false
  auth: true
  secrets: true
  api: true

nuclei:
  enabled: true
  templates: passive

nmap:
  enabled: false
