profile: passive-recon-enum

targets:
  - http://localhost:3000
  - http://localhost:8080

http:
  backend: requests
  mode: passive
  headers:
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"

crawler:
  enabled: true
  max_depth: 2
  max_pages: 25
  include_js: true
  backend: requests

validators:
  baseline_probe: true
  observed_only: false
  panels: true
  auth: true
  api: true
  sensitive_files: true
  secrets: true

nuclei:
  enabled: true
  templates: passive

nmap:
  enabled: false

# v10.22.2 semantics
# Passive enum: visible endpoint probing and light exposure checks without active exploitation.
