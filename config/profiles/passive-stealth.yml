profile: passive-stealth

targets:
  - http://localhost:3000
  - http://localhost:8080

http:
  backend: requests
  mode: passive
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"

crawler:
  enabled: true
  max_depth: 1
  max_pages: 12
  include_js: false
  backend: requests

validators:
  baseline_probe: false
  observed_only: true
  panels: false
  auth: false
  api: false
  sensitive_files: false
  secrets: true

nuclei:
  enabled: false

nmap:
  enabled: false
