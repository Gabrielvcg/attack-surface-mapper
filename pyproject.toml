[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclei-mvp-project-v10"
version = "0.10.3"
description = "Nuclei + validaciones propias + correlación + reporting + Nmap + Scrapling por modos (fetcher/dynamic)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
  "scrapling[fetchers]>=0.4.2",
  "playwright>=1.52.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
